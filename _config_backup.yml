# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: GINKA
author: mm9527
language: zh-CN
url: https://Zhouhang9527.github.io
root: /
theme: next

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# Skip rendering custom asset folders. This is crucial.
skip_render:
  - 'css/**'
  - 'js/**'
  - 'fonts/**'
  - 'images/**'
  - 'music/**'

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
relative_link: false

# Live2D (hexo-helper-live2d)
# Docs: https://github.com/EYHN/hexo-helper-live2d
live2d:
  enable: true
  # 使用本地 ATRI 模型文件
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  model:
    # 使用本地 ATRI 模型
    use: local
    path: /live2d/ATRI/ATRI.model3.json
  display:
    position: right
    width: 180
    height: 320
  mobile:
    show: true

# Deployment
deploy:
  type: git
  repo: https://github.com/Zhouhang9527/zhouhang9527.github.io.git
  branch: main

# Search Plugin for NexT
search:
  path: search.xml
  field: post
  format: html
  limit: 10000