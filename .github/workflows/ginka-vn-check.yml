name: GINKA VN validation (no deploy)
on:
  push:
    branches: ['feature/ginka-vn']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ginka-vn-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/ginka-vn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      # One-time lockfile bridge: only the public dependency metadata, no environment or secrets.
      - name: Export verified lock candidate
        run: |
          node -e "const fs=require('node:fs'),c=require('node:crypto'),b=fs.readFileSync('package-lock.json'),s=b.toString('base64');console.log('LOCK_CANDIDATE_SHA256 '+c.createHash('sha256').update(b).digest('hex'));for(let i=0;i<s.length;i+=2048)console.log('LOCK_CANDIDATE_PART '+String(i/2048).padStart(4,'0')+' '+s.slice(i,i+2048));console.log('LOCK_CANDIDATE_LENGTH '+b.length+' '+s.length)"
      - name: Typecheck
        run: npm run typecheck
      - name: Build and validate output
        id: build
        run: npm run build
      - name: Install browser
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Mascot browser fixture acceptance
        run: npm run check:mascot-browser
      - name: Browser acceptance
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && steps.chromium.conclusion == 'success' }}
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ginka-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ >/dev/null
          npm run check:vn-browser
      - name: Original UI geometry fixture
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && steps.chromium.conclusion == 'success' }}
        run: npm run check:original-browser
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ginka-vn-validation
          path: |
            astro/artifacts/vn/
            /tmp/ginka-preview.log
          if-no-files-found: ignore
          retention-days: 7
