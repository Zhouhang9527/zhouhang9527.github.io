name: GINKA Astro migration review
on:
  push:
    branches: [feature/ginka-astro]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astro-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: astro-preview-dist
          path: astro/dist/
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/ginka-astro.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          node tools/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astro-review
          path: |
            astro/artifacts/
            /tmp/ginka-astro.log
          retention-days: 7
