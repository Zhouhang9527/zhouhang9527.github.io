# ===================================================
# Hexo Configuration - GINKA Blog
# ===================================================
# Docs: https://hexo.io/docs/configuration.html

# ---------------------------------------------------------------
# Site Information
# ---------------------------------------------------------------
title: GINKA
subtitle: 'Pwn & Reverse Engineering'
description: '专注于逆向工程和二进制安全研究'
keywords: 
  - CTF
  - Reverse Engineering
  - Pwn
  - Binary Security
  - IDA Pro
author: mm9527
email: 3050055132@qq.com
language: zh-CN
timezone: Asia/Shanghai

# ---------------------------------------------------------------
# URL Configuration
# ---------------------------------------------------------------
url: https://www.mm9527.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------------------------------------------------------------
# Directory Structure
# ---------------------------------------------------------------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# ---------------------------------------------------------------
# Skip Rendering (Asset Protection)
# ---------------------------------------------------------------
skip_render:
  - '_data/**'
  - 'css/**'
  - 'js/**'
  - 'fonts/**'
  - 'images/**'
  - 'live2d/**'
  - 'music/**/*.mp3'
  - 'music/**/*.flac'
  - 'music/**/*.ogg'
  - 'music/**/*.m4a'
  - 'music/**/*.wav'

# Files ignored by Hexo are not copied into public/. Keep editor/source assets in
# the workspace while preventing stale payload from entering deployments.
ignore:
  - 'source/images/ginka-static-background.webp'
  - 'themes/next/source/images/background.mp4'
  - 'themes/next/source/fonts/LxgwWenKai.ttf'
  - 'themes/next/source/fonts/OppoSans.ttf'
  - 'themes/next/source/fonts/OppoSans-Bold.ttf'
  - 'themes/next/source/live2d/ATRI/ATRI.cmo3'
  - 'themes/next/source/live2d/ATRI/ATRI.psd'
  - 'themes/next/source/live2d/ATRI/ATRI.4096/**'

# ---------------------------------------------------------------
# Writing Configuration
# ---------------------------------------------------------------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# ---------------------------------------------------------------
# Markdown Rendering
# ---------------------------------------------------------------
marked:
  gfm: true
  pedantic: false
  breaks: true
  smartLists: true
  smartypants: true
  modifyAnchors: 0
  autolink: true
  sanitizeUrl: false
  headerIds: true
  anchorAlias: false
  lazyload: false
  prependRoot: false
  postAsset: false
  external_link:
    enable: false
    exclude: []
    nofollow: false

# ---------------------------------------------------------------
# Code Highlighting
# ---------------------------------------------------------------
highlight:
  enable: true
  line_number: true
  auto_detect: true
  tab_replace: '  '
  wrap: true
  hljs: false
  exclude_languages: []
  
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ---------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
archive_generator:
  per_page: 20
  yearly: true
  monthly: true
  daily: false
  
tag_generator:
  per_page: 10

# ---------------------------------------------------------------
# Theme Configuration
# ---------------------------------------------------------------
theme: next

# ---------------------------------------------------------------
# Music sources
# ---------------------------------------------------------------
# Keep credentials on a server-side Meting deployment. The browser only receives
# a public HTTPS endpoint that has been verified for CORS and media playback.
ginka_music:
  default_cover: /music/unhappy.jpg
  online:
    enabled: true
    # Self-hosted Meting endpoint verified for HTTPS, CORS, lyrics and ranged audio.
    # Expected query contract: ?server=netease&type=playlist&id=5190514967
    api_base: https://meting.mm9527.top/api
    platform: netease
    type: playlist
    playlist_id: '5190514967'
    timeout_ms: 8000
    cache_ttl_ms: 1800000
    # Revalidate these capabilities before replacing api_base.
    cors_audio_verified: true
    cors_lyrics_verified: true
    range_verified: true
  local:
    - id: hikari-hanate
      title: '光放て！'
      artist: '柳麻美'
      album: 'ATRI -My Dear Moments- (Original Soundtrack)'
      src: /music/ginka-op-hikari-hanate.mp3
      cover: /music/ginka-op-hikari-hanate.webp
      lyricsSrc: /music/ginka-op-hikari-hanate.lrc
    - id: yumeukihashi
      title: '夢浮桥'
      artist: '青木阳菜'
      album: GINKA ED
      src: /music/ginka-ed-yumeukihashi.mp3
      cover: /music/ginka-ed-yumeukihashi.jpg
      lyricsSrc: /music/ginka-ed-yumeukihashi.lrc
    - id: air
      title: AIR
      artist: Lia
      album: AIR OST
      src: /music/air.mp3
      cover: /music/air.jpg
      lyricsSrc: /music/air.lrc
    - id: unhappy
      title: unhappy
      artist: s0rrow
      album: Single
      src: '/music/s0rrow - unhappy.mp3'
      cover: /music/unhappy.jpg
      lyricsSrc: '/music/s0rrow - unhappy.lrc'
      translations:
        'Every day we talk a little less': '每天我们说的话都在逐渐减少'
        'It looks like you are losing interest': '看起来你正在慢慢失去兴趣'
        'These feelings I have for you': '这些我对你的感情'
        "But you don't feel the same": '可你却没有同样的感觉'
        "So I'll pack all my things": '所以我会收拾好我的一切'
        'And go run far away': '然后逃到很远的地方'
        'You are, you are very pretty': '你啊 你真的很漂亮'
        "I'm so very ugly": '而我是那么的丑陋'
        'Will you even love me, anymore (love me)': '你会再爱我吗 哪怕一点点（爱我）'
        'You can, you can live without me': '你可以 你可以没有我的生活着'
        'That makes me unhappy': '那让我感到不开心'
        'I should get a piercing through my heart': '我应该将我的心也一并刺穿'
        'What do you even want me to be': '你究竟想要我成为什么样子'
        'You never ever pay attention to me': '你从来从来都不愿多看我一眼'
        "So I'll close my blinds in misery": '所以我拉上窗帘沉进悲伤里'
        "And I'll wait for you for a couple of weeks": '然后我会一直等着你好几个星期'

# ---------------------------------------------------------------
# Live2D Configuration (Disabled - Using Custom)
# ---------------------------------------------------------------
live2d:
  enable: false

# ---------------------------------------------------------------
# Search Configuration
# ---------------------------------------------------------------
search:
  path: search.xml
  field: post
  content: true
  format: html
  limit: 10000

# ---------------------------------------------------------------
# Deployment Configuration
# ---------------------------------------------------------------
deploy:
  type: git
  repo: https://github.com/Zhouhang9527/zhouhang9527.github.io.git
  branch: main
  message: "Site updated"

# ---------------------------------------------------------------
# Extensions & Plugins
# ---------------------------------------------------------------
# All plugin configurations go here

# ---------------------------------------------------------------
# Optimization Plugins Configuration
# ---------------------------------------------------------------

# Hexo All Minifier
all_minifier: true
silent: true
image_minifier:
  enable: false
js_minifier:
  enable: true
  mangle: true
  compress: {}
css_minifier:
  enable: true
  exclude:
    - '*.styl'
html_minifier:
  enable: true
  removeComments: true
  collapseWhitespace: true
  caseSensitive: true
  minifyJS: true
  minifyCSS: true

# Hexo Generator Sitemap
sitemap:
  path: sitemap.xml

baidusitemap:
  path: baidusitemap.xml

# Hexo Generator Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  autodiscovery: true

# Hexo Lazyload Image
lazyload:
  enable: false
  onlypost: false
  loadingImg: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50' preserveAspectRatio='xMidYMid meet'%3E%3Cpath fill='%23ccc' d='M25,5A20,20,0,1,0,45,25,20,20,0,0,0,25,5Zm0,36A16,16,0,1,1,41,25,16,16,0,0,1,25,41Z'/%3E%3Cpath fill='%23333' d='M25,5A20,20,0,0,1,45,25H41A16,16,0,0,0,25,9Z'%3E%3CanimateTransform attributeName='transform' type='rotate' from='0 25 25' to='360 25 25' dur='1s' repeatCount='indefinite'/%3E%3C/path%3E%3C/svg%3E"
