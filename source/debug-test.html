<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ATRI 调试测试页面</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .test-section {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .test-btn {
      background: rgba(91, 155, 213, 0.25);
      border: 1px solid rgba(91, 155, 213, 0.5);
      color: rgba(91, 155, 213, 0.9);
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    .test-btn:hover {
      background: rgba(91, 155, 213, 0.35);
    }
    #log {
      background: #000;
      color: #0f0;
      padding: 10px;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🔍 ATRI 功能调试测试</h1>
  
  <div class="test-section">
    <h2>1. 按钮颜色测试</h2>
    <button class="test-btn">
      <i class="fa fa-eye" style="color: rgba(91, 155, 213, 0.9);"></i> 这是淡蓝色吗？
    </button>
    <p>✓ 如果看到淡蓝色图标，说明颜色正常</p>
  </div>
  
  <div class="test-section">
    <h2>2. ATRI 对象检测</h2>
    <button class="test-btn" onclick="checkATRI()">检查 ATRI 对象</button>
    <button class="test-btn" onclick="checkConfig()">检查配置</button>
    <button class="test-btn" onclick="testTalkMessages()">测试台词</button>
  </div>
  
  <div class="test-section">
    <h2>3. 音量按钮测试</h2>
    <button class="test-btn" onclick="testVolumeBtn()">测试音量按钮</button>
    <button class="test-btn" onclick="checkLocalStorage()">检查存储</button>
  </div>
  
  <div class="test-section">
    <h2>4. 歌词系统测试</h2>
    <button class="test-btn" onclick="testLyrics()">测试歌词更新</button>
    <button class="test-btn" onclick="checkTitle()">检查标题</button>
  </div>
  
  <div class="test-section">
    <h2>📋 日志输出</h2>
    <button class="test-btn" onclick="clearLog()">清空日志</button>
    <div id="log"></div>
  </div>
  
  <script src="/js/ginka-debug-test.js" defer></script>
  
  <!-- 引入 Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</body>
</html>
